<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Career Quest – AI Career Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Authentication Module -->
    <script src="auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: #e5e7eb;
            display: flex;
            height: 100vh;
        }

        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #020617;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .header {
            padding: 16px 20px;
            background: #020617;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
        }

        .chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: linear-gradient(180deg, #020617, #020617);
        }

        .message {
            max-width: 75%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border-radius: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
        }

        .user {
            background: #22c55e;
            color: #020617;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background: #1e293b;
            color: #e5e7eb;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .typing {
            font-style: italic;
            opacity: 0.7;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #1e293b;
            gap: 10px;
            background: #020617;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 50px;
            border-radius: 10px;
            border: none;
            padding: 12px;
            font-size: 15px;
            background: #0f172a;
            color: #e5e7eb;
            outline: none;
        }

        button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: #22c55e;
            color: #020617;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="header">
            🎓 <h1>Career Quest – AI Career Assistant</h1>
            <div style="margin-left: auto; display: flex; gap: 10px;">
                <a href="index.html" style="color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 0.9rem;">Back</a>
                <a href="profile.html" style="color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 0.9rem;">👤 Profile</a>
            </div>
        </div>

        <div id="chat" class="chat">
            <div class="message ai">
                Hello! 👋
                I’m your AI Career Assistant.
                Ask me about careers, skills, domains, or future paths.
            </div>
        </div>

        <div class="input-area">
            <textarea id="input" placeholder="Type your question and press Enter..."></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script>
        /**
         * ============= ROUTE PROTECTION =============
         * Verify user is authenticated before loading chatbot
         */
        function checkAuthAndInit() {
            if (!authService.isAuthenticated()) {
                console.warn("⚠️ User not authenticated - redirecting to login");
                window.location.href = 'index.html';
                return false;
            }
            console.log("✅ User authenticated - loading chatbot");
            return true;
        }

        // ============= CHATBOT LOGIC =============
        const API_KEY = "AIzaSyB8wDt0tnYap2BvtQ8Ioe4uwVWwYzQguc0";
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user");
            input.value = "";

            const typingMsg = addMessage("Thinking… 🤖", "ai");
            typingMsg.classList.add("typing");

            try {
                const response = await fetch(
                    "https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash-lite:generateContent?key=" + API_KEY,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            contents: [
                                {
                                    role: "user",
                                    parts: [{
                                        text: `You are an AI career guidance assistant. Help users choose suitable career paths based on their interests, skills, and experience. Keep responses clear, short, and practical.\n\nUser query: ${text}`
                                    }]
                                }
                            ]
                        })
                    }
                );

                const data = await response.json();
                typingMsg.remove();

                if (data.error) {
                    if (data.error.code === 429) {
                        throw new Error("Quota exceeded. Please try again later.");
                    }
                    throw new Error(data.error.message || "API Error");
                }

                if (!data.candidates || !data.candidates[0]) {
                    if (data.promptFeedback && data.promptFeedback.blockReason) {
                        throw new Error(`Response blocked: ${data.promptFeedback.blockReason}`);
                    }
                    throw new Error("No response from AI.");
                }

                const candidate = data.candidates[0];
                if (!candidate.content || !candidate.content.parts) {
                    throw new Error("Empty response content.");
                }

                const reply = candidate.content.parts[0].text;
                addMessage(reply, "ai");

            } catch (err) {
                typingMsg.remove();
                addMessage("⚠️ " + err.message, "ai");
                console.error("Chat Error:", err);
            }
        }

        /**
         * ============= PAGE INITIALIZATION =============
         * Check auth before initializing chat
         */
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndInit();
        });

        // Handle if DOMContentLoaded already fired
        if (document.readyState !== 'loading') {
            checkAuthAndInit();
        }
    </script>

</body>

</html>
