<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Content - Career Quest</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Authentication Module -->
    <script src="auth.js"></script>

    <style>
        /* --- CORE VARIABLES & RESET (Matching index.html) --- */
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #151b2b;
            --bg-sidebar: #0f131c;
            --primary-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-green: #10b981;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            height: 70px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            flex-shrink: 0;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* --- MAIN LAYOUT --- */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .module-list {
            list-style: none;
            padding: 20px;
        }

        .module-item {
            margin-bottom: 15px;
        }

        .module-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .lesson-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .lesson-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .lesson-btn.active {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border-color: rgba(102, 126, 234, 0.3);
        }

        .lesson-icon {
            font-size: 0.9rem;
        }

        /* --- CONTENT AREA --- */
        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: var(--bg-dark);
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 30px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .content-header {
            max-width: 900px;
            margin: 0 auto 20px;
        }

        .content-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .tag {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .content-body {
            max-width: 900px;
            margin: 0 auto 50px;
            line-height: 1.8;
            color: #d1d5db;
        }

        .content-body p {
            margin-bottom: 20px;
        }

        .action-bar {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-complete {
            background: var(--primary-grad);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.6);
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
        <div class="course-title" id="course-header-title">Loading Course...</div>
        <nav style="display: flex; gap: 15px;">
            <a href="profile.html" class="back-btn" style="margin: 0;">
                <i class="fas fa-user"></i> Profile
            </a>
        </nav>
    </header>

    <div class="main-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Current Track</h3>
                <h2 id="sidebar-course-name">...</h2>
            </div>

            <ul class="module-list" id="module-list-container">
                <!-- Populated via JS -->
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="content-area">
            <div id="lesson-content">
                <!-- Populated via JS -->
            </div>

            <div class="action-bar">
                <button class="btn-complete" onclick="markComplete()">
                    Complete Lesson <i class="fa-solid fa-check" style="margin-left: 8px;"></i>
                </button>
            </div>
        </main>
    </div>

    <script>
        /**
         * ============= ROUTE PROTECTION =============
         * Verify user is authenticated before loading course content
         * If not authenticated, redirect to login page
         */
        
        // Check authentication status
        function checkAuthAndInit() {
            // If user is not authenticated, redirect to login
            if (!authService.isAuthenticated()) {
                console.warn("⚠️ User not authenticated - redirecting to login");
                window.location.href = 'index.html';
                return false;
            }
            
            console.log("✅ User authenticated - loading course content");
            return true;
        }

        // --- COURSE DATA WITH REAL YOUTUBE VIDEOS (Verified Embeddable) ---
        const ALL_COURSES = {
            "AI & Data": [
                {
                    module: "Module 1: Introduction",
                    lessons: [
                        {
                            title: "What is Artificial Intelligence?",
                            tag: "Video Lesson",
                            // "Crash Course AI Preview"
                            videoId: "GvYYFloV0aA",
                            description: `<p><strong>Overview:</strong> AI is the simulation of human intelligence processes by computer systems. This video covers the definitions, the history of AI, and its three main stages: Narrow AI, General AI, and Super AI.</p>
                            <p>You'll learn how AI is currently transforming industries like healthcare with precision medicine, finance with algorithmic trading, and transportation with self-driving cars. We also touch upon the ethical considerations of rapid AI advancement.</p>`
                        },
                        {
                            title: "History of AI",
                            tag: "Reading",
                            videoId: null,
                            description: `<p>From Turing Machines to Neural Networks, trace the evolution of AI through the decades. Key milestones include:</p>
                            <ul>
                                <li><strong>1950:</strong> Alan Turing proposes the "Turing Test".</li>
                                <li><strong>1956:</strong> The term "Artificial Intelligence" is coined at the Dartmouth Conference.</li>
                                <li><strong>1997:</strong> IBM's Deep Blue defeats Garry Kasparov at chess.</li>
                                <li><strong>2012:</strong> The Deep Learning revolution begins with ImageNet.</li>
                                <li><strong>2023:</strong> The rise of Generative AI and LLMs.</li>
                            </ul>`
                        }
                    ]
                },
                {
                    module: "Module 2: Core Concepts",
                    lessons: [
                        {
                            title: "Machine Learning vs AI",
                            tag: "Video Lesson",
                            // "The 7 Steps of Machine Learning" by Google Cloud Tech
                            videoId: "nKW8Ndu7Mjw",
                            description: `<p><strong>Key Takeaways:</strong> It's crucial to understand the hierarchy: AI is the broad umbrella. Machine Learning (ML) is a subset of AI that focuses on algorithms that learn from data without explicit programming.</p>
                            <p>Deep Learning is a specialized subset of ML based on artificial neural networks, capable of learning unstructured data like images and text. This video clarifies these often confused terms.</p>`
                        },
                        {
                            title: "First Python Script",
                            tag: "Coding",
                            videoId: null,
                            description: `<p>Python is the #1 language for AI due to its simplicity and powerful libraries. In this exercise, try running this basic script to load a dataset:</p>
                            <pre style="background: #000; padding: 15px; border-radius: 8px; color: #10b981;">
import pandas as pd

data = {
    'Name': ['Alice', 'Bob', 'Charlie'],
    'Age': [25, 30, 35],
    'City': ['New York', 'Los Angeles', 'Chicago']
}

df = pd.DataFrame(data)
print(df)
                            </pre>
                            <p>This creates a simple DataFrame, the building block of data analysis in Python.</p>`
                        }
                    ]
                }
            ],
            "Design": [
                {
                    module: "Module 1: Design Thinking",
                    lessons: [
                        {
                            title: "What is UX Design?",
                            tag: "Video Lesson",
                            // "What is UX Design?" by AJ&Smart (Highly reliable)
                            videoId: "c9Wg6Cb_YlU",
                            description: `<p><strong>Lesson:</strong> User Experience (UX) design is about more than just making things look good—it's about how a product <em>feels</em>. This video explains the difference between UX and UI (User Interface) design.</p>
                            <p>You'll understand the UX process: Empathize, Define, Ideate, Prototype, and Test. These 5 stages are essential for solving real user problems.</p>`
                        },
                        {
                            title: "Color Theory Basics",
                            tag: "Reading",
                            videoId: null,
                            description: `<p>Colors evoke emotions. Blue signifies trust (Banks), Red signifies excitement or urgency (Sales), and Green signifies growth (Finance/Eco). </p>
                            <p><strong>The 60-30-10 Rule:</strong> Use 60% neutral color, 30% secondary color, and 10% accent color for a balanced design.</p>`
                        }
                    ]
                },
                {
                    module: "Module 2: Visual Skills",
                    lessons: [
                        {
                            title: "Typography Hierarchy",
                            tag: "Video Lesson",
                            // "Beginning Graphic Design: Typography" by GCFLearnFree
                            videoId: "sByzHoiYFX0",
                            description: `<p><strong>Mastery:</strong> Good typography establishes a strong visual hierarchy. It guides the user's eye across the page, telling them what is most important.</p>
                            <p>Learn about leading (line spacing), kerning (letter spacing), and how to pair fonts effectively (e.g., a Sans-Serif header with a Serif body).</p>`
                        },
                        {
                            title: "Figma for Beginners",
                            tag: "Workshop",
                            // "Figma Course - Web Design Tutorial for Beginners" by freeCodeCamp
                            videoId: "RxOQ_xT-yV8",
                            description: `<p><strong>Hands-on:</strong> Figma is the industry standard for interface design. In this crash course, you will learn the interface, how to use frames, constraints for responsive design, and basic prototyping.</p>`
                        }
                    ]
                }
            ],
            "Marketing": [
                {
                    module: "Module 1: Digital Landscape",
                    lessons: [
                        {
                            title: "Digital Marketing Strategy",
                            tag: "Video Lesson",
                            // "What is Digital Marketing?" by HubSpot
                            videoId: "Z_KspIX1oXU",
                            description: `<p><strong>Overview:</strong> This complete overview covers the pillars of digital marketing: Search Engine Optimization (SEO), Social Media Marketing (SMM), Email Marketing, and Pay-Per-Click (PPC).</p>
                            <p>Understand how these channels work together to create a cohesive funnel that drives conversions.</p>`
                        },
                        {
                            title: "Target Audience",
                            tag: "Reading",
                            videoId: null,
                            description: `<p>Before you sell, you must know <em>who</em> you are selling to. Use the <strong>Persona</strong> model:</p>
                            <ul>
                                <li><strong>Demographics:</strong> Age, Gender, Location.</li>
                                <li><strong>Psychographics:</strong> Interests, Values, Lifestyle.</li>
                                <li><strong>Pain Points:</strong> What problem does your product solve for them?</li>
                            </ul>`
                        }
                    ]
                },
                {
                    module: "Module 2: Content & SEO",
                    lessons: [
                        {
                            title: "SEO Fundamentals",
                            tag: "Video Lesson",
                            // "How Google Search Works" by Google Search Central (Extremely reliable)
                            videoId: "hF515-0Tduk",
                            description: `<p><strong>Strategy:</strong> SEO is the art of ranking high on Google without paying for ads. Learn about Keywords, On-Page Optimization (Title tags, Meta descriptions), and Off-Page Optimization (Backlinks).</p>`
                        },
                        {
                            title: "Social Media Branding",
                            tag: "Case Study",
                            videoId: null,
                            description: `<p>Consistency is key. Your brand voice should be the same on LinkedIn as it is on Twitter, but the <em>content format</em> should adapt to the platform.</p>`
                        }
                    ]
                }
            ]
        };

        // --- STATE & INIT ---
        const urlParams = new URLSearchParams(window.location.search);
        const currentDomain = urlParams.get('domain') || 'AI & Data';

        // Handle "AI & Data" vs "AI" mismatch if any
        let validDomain = 'AI & Data';
        if (ALL_COURSES[currentDomain]) {
            validDomain = currentDomain;
        } else if (currentDomain.includes('AI')) {
            validDomain = 'AI & Data';
        }

        let flattenedLessons = [];
        let currentLessonIndex = 0;

        function init() {
            // Set Titles
            document.getElementById('course-header-title').textContent = `${validDomain}: Level 1`;
            document.getElementById('sidebar-course-name').textContent = "Foundations";

            // Load Course Data
            const courseData = ALL_COURSES[validDomain] || ALL_COURSES['AI & Data'];

            // Render Sidebar
            const sidebarContainer = document.getElementById('module-list-container');
            sidebarContainer.innerHTML = '';
            flattenedLessons = [];

            courseData.forEach((mod) => {
                const li = document.createElement('li');
                li.className = 'module-item';

                let lessonsHtml = '';
                mod.lessons.forEach((lesson) => {
                    // Global index
                    const globalIndex = flattenedLessons.length;
                    flattenedLessons.push(lesson);

                    lessonsHtml += `
                        <button class="lesson-btn" id="btn-${globalIndex}" onclick="loadLesson(${globalIndex})">
                            <i class="fa-solid ${lesson.videoId ? 'fa-circle-play' : 'fa-file-lines'} lesson-icon"></i>
                            ${lesson.title}
                        </button>
                    `;
                });

                li.innerHTML = `
                    <div class="module-title">${mod.module}</div>
                    ${lessonsHtml}
                `;
                sidebarContainer.appendChild(li);
            });

            // Load First Lesson
            loadLesson(0);
        }

        function loadLesson(index) {
            currentLessonIndex = index;
            const lesson = flattenedLessons[index];

            // UI Active State
            document.querySelectorAll('.lesson-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${index}`);
            if (activeBtn) activeBtn.classList.add('active');

            // Build Video Embed
            const videoHTML = lesson.videoId ? `
                <div class="video-container">
                    <iframe class="video-iframe" 
                        src="https://www.youtube.com/embed/${lesson.videoId}?rel=0" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            ` : '';

            // Build Page
            const html = `
                ${videoHTML}
                <div class="content-header">
                    <span class="tag">${lesson.tag}</span>
                    <h1>${lesson.title}</h1>
                </div>
                <div class="content-body">
                    ${lesson.description}
                </div>
            `;

            document.getElementById('lesson-content').innerHTML = html;
        }

        function markComplete() {
            const btn = document.querySelector('.btn-complete');
            const originalText = btn.innerHTML;

            btn.innerHTML = 'Completed! <i class="fa-solid fa-check-double"></i>';
            btn.style.background = '#10b981';

            setTimeout(() => {
                if (currentLessonIndex < flattenedLessons.length - 1) {
                    loadLesson(currentLessonIndex + 1);
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                } else {
                    alert(`Congratulations! You've finished the ${validDomain} Level 1 Course.`);
                    window.location.href = 'index.html';
                }
            }, 1000);
        }

        /**
         * ============= PAGE INITIALIZATION =============
         * Verify authentication, then load course content
         */
        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuthAndInit()) {
                init();
            }
        });

        // Also handle if DOMContentLoaded already fired
        if (document.readyState !== 'loading') {
            if (checkAuthAndInit()) {
                init();
            }
        }

    </script>
</body>

</html>
